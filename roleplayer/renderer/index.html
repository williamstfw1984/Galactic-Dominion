<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galactic Dominion</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob:">
<style>
@font-face{font-family:Inter;src:url(fonts/inter.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:"Space Grotesk";src:url(fonts/space-grotesk.woff2) format("woff2");font-weight:300 700}
/* two themes: dark is the default */
:root{--bg:#0B0D12;--side:#12151D;--surface:#12151D;--raised:#1C212D;--float:rgb(11 13 18 / .62);--veil:rgb(11 13 18 / .66);--border:#262C3A;--line:#3A4254;--field:#5A6378;--text:#F2F3F7;--soft:#D5D9E4;--muted:#A9B0C2;--accent:#7FE0CF;--accent-ink:#0B1F1C;--accent-soft:#16332F;--accent-text:#B4F0E5;--strong:#F2F3F7;--strong-ink:#0B0D12;--danger:#FFB4A8;--danger-ink:#3A0D06;--danger-border:#6B2E2A;--warn:#F0C58A;--warn-bg:#3A2A12;--shadow:rgb(0 0 0 / .45)}
[data-theme=light]{--bg:#F6F7F9;--side:#FBFBFC;--surface:#FFFFFF;--raised:#EEF0F4;--float:rgb(255 255 255 / .86);--veil:rgb(246 247 249 / .9);--border:#E1E4EA;--line:#C9CEDA;--field:#7A8296;--text:#14171F;--soft:#2A3040;--muted:#555D70;--accent:#3B4CCA;--accent-ink:#FFFFFF;--accent-soft:#E7EAFB;--accent-text:#2F3EA8;--strong:#14171F;--strong-ink:#FFFFFF;--danger:#B3261E;--danger-ink:#FFFFFF;--danger-border:#E3A9A4;--warn:#7A4A06;--warn-bg:#FBEFD9;--shadow:rgb(20 23 31 / .16)}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--field) transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2{font-family:"Space Grotesk",Inter,system-ui,sans-serif;font-weight:600;margin:0}
h1{font-size:28px;line-height:1.2}h2{font-size:20px}
h3{margin:0 0 6px;font:inherit;font-weight:500}
p{margin:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1:focus,h2:focus{outline:none}
/* a scrolling box that holds .sr text must be position:relative, or that text stretches the whole page */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}.small{font-size:13px}
[hidden]{display:none!important}   /* whatever else says how a thing is laid out, hidden means not shown */
details.adv{border-top:1px solid var(--border);padding-top:4px}
details.adv summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center;gap:8px}
details.adv summary::before{content:"";width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s}   /* the arrow that shows it opens */
details.adv[open] summary::before{transform:rotate(45deg)}
details.adv summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
details.adv .fields{display:flex;flex-direction:column;gap:16px;padding-top:8px}
.tune{display:flex;align-items:center;gap:12px}
.tune input{flex:1;min-width:0;accent-color:var(--accent);min-height:44px}
.tune output{min-width:3em;text-align:right;font-variant-numeric:tabular-nums}
.cap{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.btn{min-height:44px;padding:0 20px;border-radius:24px;border:1px solid var(--line);background:none;color:var(--text);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-weight:500;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.strong{background:var(--strong);border-color:var(--strong);color:var(--strong-ink);font-weight:600}
.btn.outline{border-color:var(--accent);color:var(--accent-text);font-weight:600}
.btn.ghost{border-color:transparent}
.btn.danger{background:var(--danger);border-color:var(--danger);color:var(--danger-ink);font-weight:600}
.btn.danger-outline{border-color:var(--danger);color:var(--danger);font-weight:600}
.btn.big{min-height:52px;padding:0 28px;font-size:16px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon{width:44px;height:44px;flex:none;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:22px;display:inline-flex;align-items:center;justify-content:center}
.icon:hover{color:var(--text)}
.icon.ring{border:1px solid var(--line);color:var(--text);background:var(--float)}
.icon.fill{background:var(--accent);color:var(--accent-ink)}
label:has(+ .sr:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
svg{flex:none}
label.lbl,legend{display:block;font-weight:500;margin-bottom:6px;padding:0}
fieldset{margin:0;padding:0;border:0;min-width:0}
.field{width:100%;min-height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--field);background:var(--bg);color:var(--text)}
textarea.field{display:block;padding:12px 14px;resize:vertical;line-height:1.5}
.help{margin-top:6px;font-size:13px;color:var(--muted)}
.err{margin-top:6px;font-size:14px;color:var(--danger);font-weight:500}
.card{padding:24px;border-radius:20px;background:var(--surface);border:1px solid var(--border);display:flex;flex-direction:column;gap:16px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.row.end{align-items:flex-end}
.row.right{justify-content:flex-end}
.tall{min-height:48px}
.name{display:block;font-weight:600}
.grow{flex:1 1 200px;min-width:0}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;line-height:1.6}
.av{flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;border:2px solid;object-fit:cover;background:var(--raised)}
/* a choice between a few options, shown as one rounded bar */
.seg{display:flex;padding:4px;border-radius:26px;background:var(--bg);border:1px solid var(--line)}
.seg>*{flex:1;min-height:44px;padding:0 14px;border-radius:22px;border:0;background:none;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.seg>[aria-pressed=true],.seg>:has(:checked){background:var(--accent);color:var(--accent-ink);font-weight:600}
.seg input{position:absolute;opacity:0}
.seg>:has(:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
/* pages: a bar across the top with the program's sections, the page below it */
.app{min-height:100%;display:flex;flex-direction:column;gap:24px;padding:24px 48px 48px}
.nav{display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px}
.brand{font-family:"Space Grotesk",Inter,sans-serif;font-weight:600;font-size:22px}
.nav nav{display:flex;flex-wrap:wrap;gap:4px}
.nav nav button{min-height:44px;padding:0 16px;border-radius:22px;border:0;background:none;color:var(--muted);cursor:pointer}
.nav nav [aria-current]{background:var(--raised);color:var(--text);font-weight:600}
[data-theme=light] .nav nav [aria-current]{background:var(--accent-soft);color:var(--accent-text)}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.cols{display:grid;gap:20px;align-items:start}
.cols.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.cols.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}
/* your roleplays */
.hero{position:relative;overflow:hidden;min-height:300px;border-radius:24px;background:var(--raised);display:flex}
.hero .portrait{position:absolute;inset:0 0 0 auto;width:40%}
.hero>div{width:60%;padding:40px;display:flex;flex-direction:column;justify-content:flex-end;gap:10px}
/* a picture that fills its frame edge to edge */
.hero .portrait,.tile .portrait,.castcard .portrait,.cinema .clear .portrait{border:0;border-radius:0}
.hero h1{font-size:40px;line-height:1.1}
.hero .cap{color:var(--accent-text)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;list-style:none;margin:0;padding:0}
.tile{border-radius:18px;background:var(--surface);border:1px solid var(--border);overflow:hidden;display:flex;flex-direction:column}
.tile .open{position:relative;height:124px;padding:0;border:0;background:var(--raised);cursor:pointer;display:block;width:100%}
.tile .foot{padding:10px 8px 10px 16px;display:flex;align-items:center;gap:2px}
.tile .t,.rp .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.addtile{min-height:190px;border-radius:18px;background:none;border:2px dashed var(--field);color:var(--text);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
/* the scene */
.scene{height:100%;display:flex;overflow:hidden}
.scene .main{position:relative;flex:1;min-width:0;height:100%;display:flex;flex-direction:column;container-type:size}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.bar h1{padding:8px 16px;border-radius:22px;background:var(--float);border:1px solid var(--line);font-size:16px;max-width:36cqw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toggles{display:flex;flex-wrap:wrap;gap:4px;margin-left:auto;padding:4px;border-radius:26px;background:var(--float);border:1px solid var(--line);backdrop-filter:blur(8px)}
.pill{white-space:nowrap;min-height:44px;padding:0 14px;border-radius:22px;border:1px solid transparent;background:none;color:var(--text);font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.pill[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.portrait{position:absolute;inset:0;width:100%;height:100%;border-radius:16px;border:2px solid var(--border);object-fit:cover;object-position:50% 25%;display:flex;align-items:center;justify-content:center;font:600 clamp(28px,12cqh,96px) "Space Grotesk",Inter,sans-serif}
.stage figure{margin:0;position:relative;min-width:0}
.stage figcaption{position:absolute;z-index:1;left:8px;right:8px;bottom:8px;padding:2px 10px;border-radius:12px;background:var(--surface);font-weight:600;font-size:13px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status{flex:none;color:var(--muted);font-size:14px;display:flex;align-items:center;gap:12px;min-height:22px}
.composer{flex:none;display:flex;gap:10px;align-items:center;padding:8px;border-radius:36px;background:var(--surface);border:1px solid var(--line)}
.composer textarea{flex:1;min-width:0;min-height:52px;max-height:30cqh;padding:14px 8px;border:0;background:none;color:var(--text);resize:none;font-size:16px;outline-offset:-2px}
.composer.voiceonly{align-self:center}
.mic{flex:none;width:52px;height:52px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.mic.rec{background:var(--danger);color:var(--danger-ink)}
.words{position:relative;flex:1;min-height:0;overflow:auto;padding-right:10px;display:flex;flex-direction:column;gap:14px;overflow-wrap:anywhere}
.words p{margin:0}
.line{display:flex;gap:12px}
.line .body{min-width:0;display:flex;flex-direction:column;gap:4px}
.who{font-weight:600;font-size:13px;color:color-mix(in srgb,var(--c) 55%,var(--text));display:flex;align-items:center;gap:6px}
.narr{font-style:italic;color:var(--muted)}
.words .earlier{color:var(--muted)}
.words .now{font-weight:500}
.replay{white-space:nowrap;min-height:44px;padding:0 8px;background:none;border:0;color:var(--muted);font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;border-radius:22px;align-self:flex-start}
.dialogue{min-height:0;display:flex;flex-direction:column;gap:4px}
.dialogue header{display:flex;align-items:center;gap:8px}
.dialogue header:empty{display:none}
/* Cinema layout: whoever speaks fills the window, the others wait at the side, the words lie over the lower half */
.cinema .bar{order:-1}
.cinema .stage{flex:none;align-self:flex-end;margin:12px 24px 0 0;display:flex;flex-direction:column;gap:12px}
.cinema .stage figure{z-index:3;width:88px;height:112px}
.cinema .stage figure.clear{position:fixed;z-index:0;inset:0;width:auto;height:auto}
/* a character who is not speaking is dimmed, the name stays clear */
.stage figure:not(.clear) .portrait{opacity:.6;font-size:28px}
.cinema .clear figcaption{display:none}
.cinema .bar{position:relative;z-index:3;padding:20px 24px 0}
.cinema .lower{position:relative;z-index:2;flex:0 1 auto;min-height:0;display:flex;flex-direction:column;gap:10px;width:min(100% - 48px,960px);margin:auto auto 0;padding-bottom:28px}
/* the picture is veiled only behind the words, however many there are; above them the veil thins out along an eased curve, so no edge shows */
.cinema .lower::before{content:"";position:absolute;z-index:-1;top:-200px;bottom:0;left:50%;width:100cqw;transform:translateX(-50%);pointer-events:none;background:var(--veil);mask-image:linear-gradient(transparent,rgb(0 0 0 / .02) 20px,rgb(0 0 0 / .07) 40px,rgb(0 0 0 / .16) 60px,rgb(0 0 0 / .27) 80px,rgb(0 0 0 / .40) 100px,rgb(0 0 0 / .54) 120px,rgb(0 0 0 / .68) 140px,rgb(0 0 0 / .80) 160px,rgb(0 0 0 / .90) 180px,rgb(0 0 0 / .96) 200px,#000 230px)}
.cinema .dialogue{max-height:max(120px,calc(58cqh - 180px))}
.cinema .dialogue header .small,.cinema .replay{color:var(--soft)}
.cinema .words{flex:0 1 auto;font-size:17px}
.cinema .line .av{display:none}
.cinema .line:last-of-type .speech{font:500 clamp(20px,3.6cqh,30px)/1.3 "Space Grotesk",Inter,sans-serif}
.cinema .line:not(:last-of-type){color:var(--soft);font-size:15px}
.cinema .words .who{align-self:flex-start;padding:4px 12px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font:600 14px "Space Grotesk",Inter,sans-serif}
.cinema .words .mine .who{padding:0;background:none;color:inherit;font:600 15px Inter,sans-serif;flex:none;white-space:nowrap}
.cinema .mine .body{flex-direction:row;gap:6px}
.script{flex:0 0 380px;min-width:0;background:var(--side);border-left:1px solid var(--border);display:flex;flex-direction:column;position:relative;z-index:3}
.script header{padding:12px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.lines{position:relative;flex:1;min-height:0;overflow:auto;margin:0;padding:20px;list-style:none;display:flex;flex-direction:column;gap:14px}
.lines .who{color:var(--accent-text)}
.lines .you{color:var(--muted)}
.lines div{overflow-wrap:anywhere}
/* Studio layout: your roleplays on the left, the conversation in the middle, the speaker and the settings on the right */
.rps{order:-1;flex:0 0 264px;padding:20px 12px;background:var(--side);border-right:1px solid var(--border);display:flex;flex-direction:column;gap:12px;overflow:auto}
.rps .head{padding:0 4px;flex-wrap:nowrap}
.rplist{display:flex;flex-direction:column;gap:4px;list-style:none;margin:0;padding:0}
.rp{display:flex;align-items:center;border-radius:12px;border:1px solid transparent}
.rp.on{background:var(--raised);border-color:var(--accent)}
.rp>button:first-child{flex:1;min-width:0;min-height:56px;text-align:left;padding:8px 12px;background:none;border:0;cursor:pointer;border-radius:12px}
/* the bar runs across the whole window, as it does in Cinema */
.studio{flex-direction:column}
.studio .bar{flex:none;padding:20px 24px 12px;border-bottom:1px solid var(--border)}
.under{flex:1;min-height:0;display:flex}
.beside{flex:1;min-height:0;display:flex}
.talk{flex:1;min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:10px;padding:20px 24px}
.studio .dialogue{flex:1}
.studio .words{font-size:16px;padding:4px 10px 4px 0}
.studio .words>.muted{margin:auto}
.studio .line.mine{flex-direction:row-reverse}
.studio .mine .body{max-width:72%;padding:10px 14px;border-radius:16px 16px 4px 16px;background:var(--accent);color:var(--accent-ink)}
.studio .mine .who{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.studio .mine .narr{color:inherit}
.studio .live .speech{font-size:18px}
.panel{flex:0 0 288px;padding:16px 20px;background:var(--side);border-left:1px solid var(--border);display:flex;flex-direction:column;gap:14px;overflow:auto}
.studio .stage{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.studio .stage figure{height:56px}
.studio .stage figure.clear{grid-column:1/-1;order:-1;height:clamp(120px,26cqh,250px)}
.studio .clear .portrait{border:3px solid var(--accent)}
.studio .stage figure:not(.clear) figcaption{display:none}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;cursor:pointer}
.voicekinds{margin-top:8px}
.voicekinds legend{font-weight:500;margin-bottom:0}
.switch input{width:20px;height:20px;accent-color:var(--accent);flex:none}
/* roleplay settings and characters */
.who-in{display:flex;flex-wrap:wrap;gap:10px}
.char{min-height:56px;border-radius:28px;border:2px solid var(--line);display:flex;align-items:center}
.char.on{background:var(--raised);border-color:var(--accent)}
.char label{min-width:0;padding:6px 4px 6px 8px;display:flex;align-items:center;gap:10px;cursor:pointer}
.char input{position:absolute;opacity:0}
.char:has(:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.newchar{min-height:56px;padding:0 18px;border-radius:28px;background:none;border:2px dashed var(--field);cursor:pointer;display:flex;align-items:center;gap:8px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.ints{display:flex;flex-wrap:wrap;gap:8px}
.chk{min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--field);display:flex;align-items:center;gap:10px;cursor:pointer}
.chk input{position:absolute;opacity:0}
.chk:has(:checked){background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.chk:has(:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.memory{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.models{display:flex;flex-direction:column;gap:8px}
.chk.mem{align-items:flex-start;padding:10px 14px;border-radius:14px;border-width:2px;border-color:var(--line)}
.chk.mem:has(:checked){background:var(--raised);border-color:var(--accent);color:var(--text);font-weight:400}
.castpage{grid-template-columns:minmax(0,420px) minmax(0,1fr)}
.picture{flex:0 0 240px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:10px}
.pickpic{align-self:stretch;position:relative}
.picbtn{display:flex;align-items:center;gap:8px;text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden}
.picbtn::after{content:"";flex:none;margin-left:auto;border:5px solid transparent;border-top-color:currentColor;border-bottom:0}
.piclist{position:absolute;z-index:5;left:0;width:min(420px,80vw);max-height:300px;overflow:auto;list-style:none;margin:4px 0 0;padding:4px;border-radius:12px;background:var(--surface);border:1px solid var(--line);box-shadow:0 12px 40px var(--shadow)}
.piclist li{min-height:44px;padding:8px 12px;border-radius:8px;cursor:pointer;display:flex;align-items:center}
.piclist li:hover,.piclist li:focus{background:var(--raised);outline:none}
.piclist li:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.piclist li[aria-selected=true]{font-weight:600;color:var(--accent-text)}
.cast{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.castcard{padding:0;border-radius:18px;border:1px solid var(--border);background:var(--surface);cursor:pointer;overflow:hidden;text-align:left}
.castcard[aria-pressed=true]{border:2px solid var(--accent)}
.castcard .pic{position:relative;display:block;height:150px}
.castcard .txt{display:block;padding:10px 14px}
/* AI models */
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:22px;background:var(--surface);border:1px solid var(--border);font-size:14px}
.dot{width:10px;height:10px;border-radius:5px;background:var(--accent)}
.dot.off{background:var(--warn)}
.sizes{display:flex;flex-direction:column;gap:12px;padding:20px;border-radius:20px;background:var(--surface);border:1px solid var(--border)}
.sizes legend{float:left;width:100%;margin:0;font:600 20px "Space Grotesk",Inter,sans-serif}
.size{border-radius:14px;border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:10px}
.size.on{background:var(--raised);border:2px solid var(--accent)}
.size label{display:flex;align-items:flex-start;gap:12px;cursor:pointer}
.size input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
.pick{display:inline-block;margin-left:8px;padding:2px 10px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:600 12px/1.5 Inter,system-ui,sans-serif;white-space:nowrap}
.pick.warn{background:var(--warn-bg);color:var(--warn)}
.prog{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.prog progress{flex:1 1 200px;height:8px;accent-color:var(--accent)}
/* about you */
.facts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.facts li{padding:4px 4px 4px 14px;border-radius:12px;border:1px solid var(--border);display:flex;align-items:center;gap:12px}
.facts.found li{padding:10px 14px}
.chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.chips li{padding-left:14px;border-radius:22px;background:var(--raised);border:1px solid var(--border);display:flex;align-items:center;font-size:14px}
/* admin */
.admin{height:100%;display:flex}
.adminnav{flex:0 0 264px;padding:24px 12px;background:var(--side);border-right:1px solid var(--border);display:flex;flex-direction:column;gap:4px;overflow:auto}
.adminnav .tabs{display:flex;flex-direction:column;gap:4px;flex:1}
.adminnav .tabs button{min-height:44px;padding:0 12px;border-radius:12px;border:0;background:none;color:var(--soft);cursor:pointer;text-align:left}
.adminnav .tabs [aria-current]{background:var(--raised);color:var(--text);font-weight:600}
.adminmain{flex:1;min-width:0;padding:28px 36px;display:flex;flex-direction:column;gap:16px;overflow:auto}
.unsaved{padding:4px 12px;border-radius:12px;background:var(--warn-bg);color:var(--warn);font-size:13px;font-weight:600}
.promptrow{flex:1;min-height:420px;display:flex;gap:20px}
.promptrow textarea{flex:1;min-width:0;resize:none}
.tags{flex:0 0 280px;gap:10px;overflow:auto}
.tags div{display:flex;flex-wrap:wrap;gap:6px}
.tag{min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--accent-text);cursor:pointer}
.call{border:1px solid var(--border);border-radius:12px;padding:0 14px}
.call summary{min-height:44px;display:flex;align-items:center;cursor:pointer}
.call label{display:block;margin-bottom:8px}
.call textarea{margin-bottom:14px}
.standin{margin-bottom:14px;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:8px 16px;align-items:center}
.standin label{margin:0}
.call pre{margin:0 0 12px;padding:10px 12px;border-radius:8px;background:var(--raised);white-space:pre-wrap;overflow-wrap:anywhere}
/* messages and questions */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:min(560px,calc(100% - 32px));padding:12px 20px;border-radius:24px;background:var(--strong);color:var(--strong-ink);font-weight:500;box-shadow:0 8px 30px var(--shadow);z-index:50}
#toast:empty{display:none}
dialog{border:1px solid var(--line);border-radius:24px;background:var(--surface);color:var(--text);padding:28px;width:min(440px,calc(100% - 32px));box-shadow:0 20px 60px var(--shadow)}
dialog::backdrop{background:rgb(0 0 0 / .6)}
dialog form{display:flex;flex-direction:column;gap:16px}
.helpline{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--raised);font-size:16px}
#helpDlg p{margin:0}
#askText{font:600 20px/1.3 "Space Grotesk",Inter,sans-serif}
@media (max-width:1000px){
 .app{padding:16px 16px 32px}
 .cols.two,.cols.three,.castpage{grid-template-columns:minmax(0,1fr)}
 .hero .portrait{display:none}.hero>div{width:100%}
 /* Studio: the list of roleplays goes, the scene panel becomes a strip above the conversation */
 .rps,.studio .stage figure:not(.clear){display:none}
 .beside{flex-direction:column}
 .panel{order:-1;flex:none;max-height:38cqh;flex-direction:row;flex-wrap:wrap;align-items:flex-start;border-left:0;border-bottom:1px solid var(--border)}
 .studio .stage{flex:0 0 120px}.studio .stage figure.clear{height:120px}
 /* Cinema: only the speaker is shown */
 .cinema .stage figure:not(.clear){display:none}.cinema .stage{margin:0}
 .script{position:fixed;inset:0;z-index:15}
 .admin{flex-direction:column;height:auto;min-height:100%}.adminnav{flex:none}.adminnav .tabs{flex-direction:row;flex-wrap:wrap}.adminmain{overflow:visible}
 .promptrow{flex-direction:column}.tags{flex:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

<body>
<script src="../built-in.js"></script>
<script src="../helplines.js"></script>
<script src="avatars/index.js"></script>
<script src="password.js"></script>
<script>
"use strict";
document.body.insertAdjacentHTML("afterbegin", `<div id="app" style="height:100%"></div>
<div id="toast" role="alert"></div>
<dialog id="adminDlg" aria-labelledby="adminDlgT">
<form method="dialog" data-submit="adminLogin">
<h2 id="adminDlgT">Admin access</h2>
<div><label class="lbl" for="adminPw">Password</label><input class="field" id="adminPw" type="password" autocomplete="off"><div class="err" id="adminErr" aria-live="polite"></div></div>
<div class="row right"><button type="button" class="btn" data-act="adminCancel">Cancel</button><button class="btn primary">Unlock</button></div>
</form>
</dialog>
<dialog id="retryDlg" aria-labelledby="retryT">
<form method="dialog">
<h2 id="retryT">Retry this reply</h2>
<p class="muted">What was wrong with it? The character is told, and writes the reply again.</p>
<fieldset><legend class="sr">Reason</legend><div id="retryReasons" class="models"></div></fieldset>
<div class="row right"><button type="button" class="btn" data-act="closeRetry">Cancel</button><button class="btn primary" value="go">Retry</button></div>
</form>
</dialog>
<dialog id="helpDlg" aria-labelledby="helpT" aria-describedby="helpWhy">
<form method="dialog">
<h2 id="helpT"></h2>
<p id="helpWhy"></p>
<div id="helpLine" class="helpline"></div>
<p id="helpEmergency"></p>
<p class="muted small" id="helpElsewhere"></p>
<div class="row right"><button class="btn" value="close" id="helpClose"></button><button class="btn primary" value="carry" id="helpCarry"></button></div>
</form>
</dialog>
<dialog id="askDlg" aria-labelledby="askText">
<form method="dialog">
<p id="askText"></p>
<div class="row right"><button class="btn" value="no" id="askNo"></button><button class="btn" value="yes" id="askYes"></button></div>
</form>
</dialog>`);
/* ---------- build constants ---------- */
let CFG = null;         // system prompt, interests, models and admin password; loaded from the program at start
const MAX_CHARS = 3;      // characters per roleplay
/* memory for a roleplay: tokens the engine holds at once, label, what the user should know */
const CONTEXTS = [
  [4096, "Standard", "Fastest. Recent lines are remembered word for word, older ones as a summary."],
  [8192, "Larger", "Remembers about twice as much word for word. Uses more memory."],
  [16384, "Large", "Needs noticeably more memory. Without a graphics card, each reply starts more slowly as the conversation grows."],
  [32768, "Very large", "Warning: needs a lot of memory. Without a strong graphics card, replies can take a long time to start."],
  [131072, "Maximum", "Warning: needs a powerful graphics card with a great deal of memory. Many computers cannot load it at all, and replies can take minutes. If the model itself holds less, its own maximum is used."]
];
/* When a voice may start before its line is fully written: the margin kept on the estimate, how far a reply may run over
   its asked length, the length in characters of a typical sentence, and of a word with its space. */
const EARLY = {margin:1.25, overrun:1.3, sentence:80, word:6};
const fill = (text, map) => text.replace(/\[([A-Za-z_]+)\]/g, (tag, name) => map[name.toUpperCase()] ?? tag);
const LENGTHS = [["short", "Short", 25], ["medium", "Medium", 50], ["long", "Long", 100]];   // reply length: key, label, words
const PALETTE = [["#F2A65A","#4A2F12","#FFD9A8"],["#7FB2FF","#16305A","#CFE2FF"],["#C7A0F5","#35245A","#E9DAFF"],["#7FD99A","#143D22","#CFF5DA"],["#F58FB0","#4F1930","#FFD3E0"],["#E6D36A","#3F380F","#FFF3B0"]];

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
// Narration is text between single asterisks, e.g. *she smiles*. Doubled asterisks (bold) and a lone asterisk are not narration.
const lineParts = text => text.replace(/\*{2,}/g, "").split(/\*(\S(?:[^*]*\S)?)\*/).map((t, i) => ({narration:i % 2 === 1, text:t.replace(/[*\s]+/g, " ").trim()})).filter(p => p.text);
const lineHtml = text => lineParts(unvoiced(text)).map(p => p.narration ? `<span class="narr"><span class="sr">Narration: </span>${esc(p.text)}</span>` : `<span>${esc(p.text)}</span>`).join(" ");
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const ICON = {
  plus:'<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  bin:'<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
  x:'<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  back:'<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  vol:'<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4h4l5 4V6L8 10H4zM16 9a4 4 0 010 6M18.5 6.5a8 8 0 010 11"/></svg>',
  chat:'<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4V5z"/></svg>',
  kbd:'<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M8 14h8"/></svg>',
  mic:'<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>',
  left:'<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  right:'<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  sun:'<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>',
  moon:'<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg>',
  wave:'<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 10v4M9 6v12M13 9v6M17 4v16M21 10v4"/></svg>',
  edit:'<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>',
  down:'<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>',
  up:'<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V9M7 14l5-5 5 5M5 4h14"/></svg>'
};

/* ---------- state ---------- */
const KEY = "roleplayer_v1";
const blank = () => ({characters:[], roleplays:[], facts:[], user:{name:"", age:"", gender:""}, userInterests:[], ownInterests:[], narrator:"bf_emma", narratorMood:"", voices:[], paced:{}, computer:null, remember:true, ui:{voice:true, captions:true, text:true, layout:"cinema", kinds:["standard"]}, model:"", theme:"dark", current:null, userMsgs:0});
const CHECK_FORM = 3;   // raised whenever the check of the computer measures something more
let S = (() => { try { return Object.assign(blank(), JSON.parse(localStorage.getItem(KEY) || "{}")); } catch { return blank(); } })();
S.ui = {...blank().ui, ...S.ui};   // settings added since the data was saved start at their usual values
if(S.ui.needs){ S.ui.kinds = ["standard", ...S.ui.needs]; delete S.ui.needs; }   // an earlier way of saying which voices to list: the kinds shown beside the standard ones
if(S.computer?.form !== CHECK_FORM) S.computer = null;   // what an earlier version of the check found is not shown: it measured less
for(const rp of S.roleplays) if(rp.narrator === undefined){ rp.narrator = S.narrator; rp.narratorMood = S.narratorMood; }   // from when one narrator read every roleplay
for(const rp of S.roleplays) rp.messages = rp.messages.filter(m => m.ts);   // a line that was still being written when the program closed
const showTheme = () => { document.documentElement.dataset.theme = S.theme; };
showTheme();   // straight away, so the window does not open in the other theme
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch { toast("Could not save: the storage is full. Delete old roleplays or use smaller avatar pictures."); } }
let view = "chat", D = null, adminOpen = false, dirty = false, busy = false, runId = 0, statusText = "", failed = false, scriptOpen = false, adminTab = "prompt", callLog = null, speaking = null, viewed = null, newPassword = "";
const sameInterest = (a, b) => a.toLowerCase() === b.toLowerCase();
const interestsWith = own => [...CFG.interests, ...own.filter(mine => !CFG.interests.some(i => sameInterest(i, mine)))];
const interests = () => interestsWith(S.ownInterests);
const interestBoxes = (act, ticked, offered = interests()) => `<div class="ints">${offered.map(i => `<label class="chk"><input type="checkbox" data-act="${act}" data-v="${esc(i)}" ${ticked.includes(i) ? "checked" : ""}>${esc(i)}</label>`).join("")}</div>`;
const ownInterestForm = `<form class="row end" data-submit="addOwnInt"><div class="grow"><label class="lbl" for="own-int">Add your own interest</label><input class="field" id="own-int" maxlength="40"></div><button class="btn outline tall">Add</button></form>`;
const userInterests = () => S.userInterests.filter(i => interests().includes(i));
const getChar = id => S.characters.find(c => c.id === id);
const curRp = () => S.roleplays.find(r => r.id === S.current);
const rpChars = rp => rp.charIds.map(getChar).filter(Boolean);
const colour = c => PALETTE[Math.max(0, S.characters.findIndex(x => x.id === c.id)) % PALETTE.length];
function avatar(c, size){
  const [ring, bg, fg] = colour(c);
  const st = `width:${size}px;height:${size}px;border-color:${ring};font-size:${Math.round(size*.38)}px`;
  return c.avatar ? `<img class="av" alt="" src="${esc(c.avatar)}" style="${st}">` : `<div class="av" aria-hidden="true" style="${st};background:${bg};color:${fg}">${esc((c.name||"?")[0].toUpperCase())}</div>`;
}
function portrait(c){
  const [ring, bg, fg] = colour(c);
  return c.avatar ? `<img class="portrait" alt="" src="${esc(c.avatar)}">` : `<div class="portrait" aria-hidden="true" style="border-color:${ring};background:${bg};color:${fg}">${esc((c.name||"?")[0].toUpperCase())}</div>`;
}
/* Asks a yes-or-no question inside the page. The system's own confirm box is not used:
   on Windows, text boxes can stop accepting the keyboard after it closes. */
function confirmed(question, yes, {no = "Cancel", kind = "danger"} = {}){
  const dlg = $("#askDlg");
  $("#askText").textContent = question; $("#askNo").textContent = no; $("#askYes").textContent = yes; $("#askYes").className = "btn " + kind;
  dlg.returnValue = "";
  dlg.showModal();
  return new Promise(done => dlg.addEventListener("close", () => done(dlg.returnValue === "yes"), {once:true}));
}
let toastT;
function toast(m){ $("#toast").textContent = m; clearTimeout(toastT); toastT = setTimeout(() => $("#toast").textContent = "", 7000); }

/* ---------- local AI engine ---------- */
const parseJson = s => JSON.parse(s.slice(s.indexOf("{"), s.lastIndexOf("}") + 1));
const SIZES = [
  ["small", "Small", "Fastest. For ordinary laptops with 8 GB of memory. Conversation is simpler."],
  ["medium", "Medium", "Better conversation. The recommended model fits on a graphics card with 8 GB; without a card it needs 16 GB of memory and is slow."],
  ["large", "Large", "Best conversation. Needs a powerful graphics card."]
];
let engine = {installed:false, models:[], described:false}, working = "";   // working: what is downloading now ("engine", "described" or a model name), or "computer" while the computer is checked
const hasModel = name => { const wanted = [name, name + ":latest"].map(n => n.toLowerCase()); return engine.models.some(n => wanted.includes(n.toLowerCase())); };   // the engine does not mind the case of a name
let engineChecked = null;   // settles once the engine has first been asked what is installed
/* Every model on offer: its size, its place in that size (the first is the recommended one), its name and its note. */
const offered = () => SIZES.flatMap(([size, label]) => CFG.models[size].map((model, place) => ({...model, size, label, place})));
/* The model a roleplay runs on: its own, or the default. */
const modelOf = rp => rp?.model || S.model;
/* Whether the AI engine is set up, with the models that are part of it. */
const engineReady = () => engine.installed && BuiltIn.ENGINE_MODELS.every(hasModel);
/* What stands between the user and a roleplay, in words, or "" when the engine and the roleplay's model are ready. */
function modelProblem(rp){
  if(!engine.installed) return "The AI engine and an AI model are not installed yet. Roleplays cannot run without them.";
  if(!engineReady()) return "The AI engine is not completely set up yet. Roleplays cannot run without it.";
  const without = " Roleplays cannot run without one.";
  if(rp?.model) return hasModel(rp.model) ? "" : "The AI model chosen for this roleplay is not downloaded." + without;
  if(hasModel(S.model)) return "";
  return (offered().some(model => hasModel(model.name)) ? "No downloaded AI model is chosen as the default." : "No AI model is installed yet.") + without;
}
/* True when a model is ready. Otherwise says what is missing and offers the page where it is put right. */
async function requireModel(rp){
  await engineChecked;
  const problem = modelProblem(rp);
  if(problem && await confirmed(problem, "Open AI model", {no:"Not now", kind:"primary"})) A.goModel();
  return !problem;
}
async function refreshEngine(){
  try { engine = await window.api.engineStatus(); } catch(e){ toast(e.message); }
  if(view === "model") render(false);
}
let queue = Promise.resolve();
/* One request at a time. A request still waiting when the characters are cut off, or a new turn starts, is not sent. */
const CUT_OFF = "The request was cut off.";
function queued(request){
  const run = runId;
  const p = queue.then(() => { if(run !== runId) throw new Error(CUT_OFF); return request(); }).then(out => { if(!out) throw new Error("The AI sent back an empty reply. Please try again."); return out; });
  queue = p.catch(() => {});
  return p;
}
const modelLimits = {};   // the largest context each model accepts, as the engine reports it
/* The context size to use for a roleplay: what was chosen for it, but never more than the model accepts.
   Every request in a roleplay uses the same size, because the engine reloads the model whenever it changes. */
async function contextFor(model, wanted){
  if(!modelLimits[model]) modelLimits[model] = await window.api.modelContext(model).catch(() => 0);   // asked again next time if the engine could not say
  return modelLimits[model] ? Math.min(wanted, modelLimits[model]) : wanted;
}
const contextSize = rp => contextFor(modelOf(rp), Number(rp.context) || CONTEXTS[0][0]);
/* The summary and the notes about the user are written by the small helper model that is part of the AI engine,
   between turns, so that the roleplay model is free for the next line. When the helper is the roleplay model itself,
   the roleplay model does that work. */
const HELPER_CONTEXT = 8192;
const helps = rp => BuiltIn.HELPER !== modelOf(rp);
const helperContext = rp => helps(rp) ? contextFor(BuiltIn.HELPER, HELPER_CONTEXT) : contextSize(rp);
const tokensIn = text => Math.ceil(text.length / 3);   // a cautious estimate: ordinary text is nearer four characters to a token
/* Makes one request to the model for a roleplay and records it for the admin page. The record is dropped if the
   roleplay was deleted or restarted while the request was running. */
async function request(rp, purpose, body, send){
  const began = Date.now(), run = runId, played = rp.began, {helper, ...sent} = body, model = helper && helps(rp) ? BuiltIn.HELPER : modelOf(rp);
  const entry = {at:new Date(began).toISOString(), purpose, model, context:await (helper ? helperContext(rp) : contextSize(rp)), temperature:body.temperature, penalty:body.penalty, think:body.think, messages:body.messages};
  if(run !== runId) throw new Error(CUT_OFF);
  try { return entry.reply = await send({...sent, model, context:entry.context}); }
  catch(e){ entry.error = e.message; throw e; }
  finally {
    entry.seconds = (Date.now() - began) / 1000;
    if(S.roleplays.includes(rp) && rp.began === played) window.api.logCall({id:rp.id, entry}).catch(() => {});
  }
}
const ask = (rp, purpose, body) => queued(() => request(rp, purpose, body, window.api.chat));
const askStream = (rp, purpose, body, onText) => queued(() => request(rp, purpose, body, sent => window.api.chatStream(sent, onText)));
/* Runs one download, or the check of the computer. While it runs, no other can be started. */
async function fetching(what, get, failed){
  working = what; if(view === "model") render(false);
  try { await get(); } catch(e){ toast(failed + " " + e.message); }
  working = ""; await refreshEngine();
}
const download = model => fetching(model, () => window.api.pullModel(model), "The download did not finish.");
function showProgress(info){
  if(info.kind === "voiceReady"){ const bar = readying && $(`#${readying}-ready`); if(bar) bar.lastElementChild.textContent = info.phase + "…"; return; }
  const model = offered().find(m => m.name === info.model);
  const bar = info.kind === "engine" || BuiltIn.ENGINE_MODELS.includes(info.model) ? "engine"   // the engine's own models are downloaded as part of setting it up
    : info.kind === "voice" ? "described" : model ? model.size + "-" + model.place : "expressive";
  const el = $("#prog-" + bar); if(!el) return;
  const gb = n => (n / 1e9).toFixed(1) + " GB";
  el.hidden = false;
  el.firstElementChild.value = info.total ? Math.round(100 * info.done / info.total) : 0;

     held until it can be played through without stopping; then it plays, whatever is still to come: such a voice starts
     with its first sentence, and waits between sentences when the next one is not ready, never in the middle of one. */
  const release = () => {
    if(!ready.length || !ready[0].from.open || (!started && !ready[0].from.parts && !safe())) return;
    if(!started) onStart?.();
    started = true;
    while(ready.length && ready[0].from.open){ const clip = ready.shift(); heard = play(clip, () => { if(wanted() && clip.piece) onSaid?.(clip.piece); }); }
  };
  /* A piece's sound comes in one part, or a part at a time while the rest is still being made. */
  const make = (piece, voice, text, description) => {
    unmade += piece.text.length;
    made = made.then(async () => {
      const began = performance.now();
      /* parts: whether this piece comes a part at a time. open: whether it may be played: at once for a piece that comes
         whole; for one in parts, when all of it has come, or sooner, once the sound in hand covers how far making the
         rest of the piece will fall behind speaking it. How long the piece will last is judged from what this voice
         has spoken before; until it has spoken, the piece opens early only if it is plainly made faster than spoken. */
      const from = {parts:hears(voice) || described(voice), open:false}, known = paced[voice];
      let seconds = 0, begun = false;
      from.open = !from.parts;
      if(wanted()){
        try {
          await window.api.speak({text, voice:described(voice) ? NEW_VOICE : voice, made:madeFrom(voice, description)}, ({samples, rate:hz}) => {
            const length = samples.length / hz;
            seconds += length;
            const elapsed = (performance.now() - began) / 1000, speed = seconds / elapsed;   // seconds of sound made in a second, the wait for the first part included
            const left = known ? Math.max(0, piece.text.length * known.sound / known.chars - seconds) : Infinity;
            if(known ? seconds >= Math.max(0, left * (1 / speed - 1)) * EARLY.margin + length : begun && seconds - length >= elapsed * EARLY.margin) from.open = true;
            if(wanted()) ready.push({samples, rate:hz, seconds:length, from, piece:begun ? null : piece});   // the captions follow a piece from its first sound
            begun = true;
            release();
          });
          rate.chars += piece.text.length; rate.making += (performance.now() - began) / 1000; rate.sound += seconds;
          paced[voice] = {chars:(known?.chars || 0) + piece.text.length, sound:(known?.sound || 0) + seconds};
        } catch(e){ failure ??= e; }   // the other pieces are still spoken
      }
      unmade -= piece.text.length; from.open = true;
      release();
    });
  };
  const say = piece => {
    const voice = piece.narration ? reader.narrator : voiceFor(c), text = hears(voice) ? piece.text : unvoiced(piece.text);
    if(voice && pronounceable(text)) make(piece, voice, text, soundOf(c, piece.narration && reader));   // the description is used only by a described voice
  };
  const take = (text, end) => { if(end > used){ linePieces(text.slice(used, end)).forEach(say); used = end; } };
  return {
    add(text){
      if(!since){ since = performance.now(); first = text.length; }
      written = text.length; take(text, speakableEnd(text, used)); release();
    },
    finish(text){
      written = text.length; take(text, text.length); complete = true; release();
      return made.then(() => heard).then(() => { if(failure && wanted()) toast("Part of this line could not be spoken. " + failure.message); });
    }
  };
}
/* Speaks a line that is already complete, whether or not the voice is switched on. While it is spoken, the captions follow
   it sentence by sentence. onStart: called as the first sound is heard. */
async function speak(text, c, id, onStart){
  const following = {id, said:[]};
  const voice = speaker(c, true, piece => { following.said.push(piece); renderScene(); }, onStart);
  if(id){ speaking = following; renderScene(); }
  await voice.finish(text);
  if(speaking === following){ speaking = null; renderScene(); }
}
function stopSpeech(){ utterance++; window.api.stopSpeaking(); playing.forEach(source => source.stop()); playing = []; nextStart = 0; speaking = null; }

/* ---------- voice in (Whisper, runs on this computer) ---------- */
let rec = null, micHeld = false, press = 0;   // press: counts each time the microphone is pressed or let go, to tell one press from the next
/* Recording lasts for as long as the microphone button or the space bar is held. */
async function holdMic(){
  if(micHeld || rec) return;
  micHeld = true;
  const mine = ++press, scene = curRp();
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({audio:true}); } catch { micHeld = false; return toast("No microphone was found, or access to it was not allowed."); }
  if(mine !== press) return stream.getTracks().forEach(t => t.stop());   // let go before the microphone was ready
  const left = () => view !== "chat" || curRp() !== scene;   // the user has gone elsewhere: what was recorded is not sent
  interrupt();
  const chunks = []; rec = new MediaRecorder(stream);
  rec.ondataavailable = e => chunks.push(e.data);
  rec.onstop = async () => {
    rec = null; stream.getTracks().forEach(t => t.stop()); updateComposer();
    if(left()) return;
    setStatus("Working out what you said…");
    let text = "";
    try {
      const ctx = new AudioContext({sampleRate:16000});
      const pcm = (await ctx.decodeAudioData(await new Blob(chunks).arrayBuffer())).getChannelData(0);
      ctx.close();
      const loud = Math.sqrt(pcm.reduce((sum, v) => sum + v * v, 0) / (pcm.length || 1)) > 0.005;   // skip silence: the recogniser invents words for it
      if(loud) text = await window.api.transcribe(pcm);
    } catch(e){ if(left()) return; setStatus(""); resume(); return toast("Your speech could not be understood. " + e.message); }
    if(left()) return;
    setStatus("");
    if(!text){ resume(); return toast("No speech was heard. Hold the microphone or the space bar while you speak."); }
    const box = $("#reply"), typed = box?.value.trim();   // anything already typed goes with it
    if(box) box.value = "";
    sendUser(typed ? typed + " " + text : text);
  };
  rec.start(); updateComposer();
}
function releaseMic(){ micHeld = false; press++; if(rec?.state === "recording") rec.stop(); }

/* ---------- characters and roleplays in files ---------- */
/* A file holds one character, or one roleplay with all its characters, and the saved voices they use, each with its
   sample, so that they look and sound the same where the file is uploaded. A roleplay is its set-up only, never its
   conversation, and nothing of the admin settings goes in. Things in the file refer to each other by refs ("c1", "v1"). */
const FILE_FORMAT = 1;
const MOST = {name:30, personality:800, speech:200, examples:800, relationship:200, goals:300, mood:300, title:60, scenario:1500, openingNarration:400, openingSpeech:400, toneWords:300, interest:40, interests:30};
const fileName = (text, kind) => (String(text).replace(/[^\p{L}\p{N} _-]+/gu, "").trim().slice(0, 60) || kind) + `.${kind}.json`;
/* The saved voices among the given ones, with their samples, and the ref each is known by in the file. */
/* The voices made from descriptions that the given characters and narrators use, with their sounds, and the ref each is
   known by in the file: saved voices, and voices made from a description and not saved, which go by that description.
   A saved voice whose sound has been lost cannot go in a file. */
async function packVoices(chars, readers){
  const voices = [];
  for(const id of new Set([...chars.map(c => c.voice), ...readers.map(reader => reader.narrator)])){
    const v = savedVoice(id); if(!v) continue;
    const sample = await window.api.voiceSample(v.id);
    if(!sample) throw new Error(`The voice "${v.name}" has lost its sound. Delete it and make it again, then download.`);
    voices.push({ref:"v" + (voices.length + 1), id:v.id, name:v.name, gender:v.gender, description:v.description, sample});
  }
  for(const {key} of describing(chars, readers, c => c.voice).filter(voice => !savedVoice(voice.key))){
    const sample = await window.api.voiceSample(key);
    if(sample) voices.push({ref:"v" + (voices.length + 1), unsaved:true, description:key, sample});   // one never made here is made from its description there, as it would be here
  }
  const refOf = id => voices.find(v => v.id === id)?.ref;
  return {list:voices.map(({id, ...v}) => v), voiceIn:id => savedVoice(id) ? SAVED + refOf(id) : id || ""};
}
/* What makes a character: what goes in a file, and what two characters are compared by. */
const CHARACTER_FIELDS = ["name", "age", "gender", "personality", ...CHARACTER_DETAILS, "interests", "avatar", "voice", "mood"];
const packCharacter = (c, ref, voiceIn) => ({ref, name:c.name, age:c.age, gender:c.gender, personality:c.personality || "", ...Object.fromEntries(CHARACTER_DETAILS.map(key => [key, c[key] || ""])), interests:[...c.interests || []], picture:c.avatar || "", voice:voiceIn(c.voice), mood:c.mood || ""});
async function saveToFile(kind, name, data){
  try { if(await window.api.saveFile({name:fileName(name, kind), text:JSON.stringify({roleplayer:FILE_FORMAT, kind, ...data}, null, 2)})) toast(`"${name}" was downloaded.`); }
  catch(e){ toast("The file could not be saved. " + e.message); }
}
async function downloadCharacter(c){
  let voices;
  try { voices = await packVoices([c], []); } catch(e){ return toast(e.message); }
  saveToFile("character", c.name, {voices:voices.list, characters:[packCharacter(c, "c1", voices.voiceIn)]});
}
async function downloadRoleplay(rp){
  const chars = rpChars(rp);
  if(!chars.length) return toast("This roleplay has no characters, so it cannot be downloaded. Edit it to choose some.");
  let voices;
  try { voices = await packVoices(chars, [rp]); } catch(e){ return toast(e.message); }
  const refOf = c => "c" + (chars.indexOf(c) + 1);
  saveToFile("roleplay", rp.title, {voices:voices.list, characters:chars.map(c => packCharacter(c, refOf(c), voices.voiceIn)), roleplay:{
    title:rp.title, scenario:rp.scenario || "", openingNarration:rp.openingNarration || "", openingSpeech:rp.openingSpeech || "", openingBy:refOf(getChar(rp.openingBy) || chars[0]), characters:chars.map(refOf),
    length:rp.length || LENGTHS[0][0], memory:Number(rp.context) || CONTEXTS[0][0], narrator:voices.voiceIn(rp.narrator), narratorMood:rp.narratorMood || "",
    model:rp.model || "", temperature:rp.temperature ?? null, penalty:rp.penalty ?? null, think:!!rp.think, planning:rp.planning || "", tone:knownTones(rp.tone), toneWords:rp.toneWords || ""}});
}
/* What a file holds, checked and put into the program's own terms, or an error that says what is wrong with it. Nothing
   is kept until all of it has been checked. */
const fileText = (value, most) => typeof value === "string" ? value.trim().slice(0, most) : "";
const fileError = message => { throw new Error(message); };
function readFile(raw, kind){
  let data;
  try { data = JSON.parse(raw); } catch { fileError("This is not a Galactic Dominion file."); }
  if(data?.roleplayer !== FILE_FORMAT || !["character", "roleplay"].includes(data.kind)) fileError("This is not a Galactic Dominion file, or it comes from a different version of the program.");
  if(data.kind !== kind) fileError(`This file holds a ${data.kind}, not a ${kind}.`);
  const voices = (Array.isArray(data.voices) ? data.voices : []).map(v => ({ref:String(v?.ref), unsaved:v?.unsaved === true, name:fileText(v?.name, MOST.name) || "Voice", gender:["female", "male"].includes(v?.gender) ? v.gender : "", description:fileText(v?.description, MOST.mood), sample:typeof v?.sample === "string" ? v.sample : ""}));
  const sound = sample => { try { const start = atob(sample.slice(0, 16)); return start.startsWith("RIFF") && start.slice(8, 12) === "WAVE"; } catch { return false; } };
  if(voices.some(v => !sound(v.sample))) fileError("A voice in this file is not a sound the program can use.");
  const voiceIn = (id, otherwise) => {
    if(typeof id !== "string") return otherwise;
    if(id.startsWith(SAVED)) return voices.some(v => v.ref === id.slice(SAVED.length)) ? id : otherwise;
    return id === NEW_VOICE || voiceList.some(v => v.id === id) ? id : otherwise;
  };
  const apart = list => new Set(list.map(item => item.ref)).size === list.length;   // two things with one ref could not be told apart
  if(!apart(voices)) fileError("This file is damaged: two of its voices cannot be told apart.");
  const characters = (Array.isArray(data.characters) ? data.characters : []).map(o => {
    const name = fileText(o?.name, MOST.name), age = Number(o?.age);
    if(!name) fileError("A character in this file has no name.");
    if(!Number.isInteger(age) || age < 18 || age > 120) fileError(`"${name}" in this file is not given an age of 18 or older.`);
    if(!GENDERS.includes(o.gender)) fileError(`"${name}" in this file has a gender the program does not know.`);
    const picture = typeof o.picture === "string" && (/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(o.picture) || stock(o.picture)) ? o.picture : "";
    return {ref:String(o.ref), name, age, gender:o.gender, personality:fileText(o.personality, MOST.personality), ...Object.fromEntries(CHARACTER_DETAILS.map(key => [key, fileText(o[key], MOST[key])])),
      interests:(Array.isArray(o.interests) ? o.interests : []).map(i => fileText(i, MOST.interest)).filter(Boolean).slice(0, MOST.interests), avatar:picture, voice:voiceIn(o.voice, ""), mood:fileText(o.mood, MOST.mood)};
  });
  if(!characters.length) fileError(kind === "character" ? "This file holds no character." : "This roleplay has no characters in the file.");
  if(!apart(characters)) fileError("This file is damaged: two of its characters cannot be told apart.");
  /* The file's voices that what is kept uses: saved ones by their ref, others by the description they are made from. */
  const used = (chars, readers) => voices.filter(v => v.unsaved ? describing(chars, readers, c => c.voice).some(voice => voice.key === v.description) : [...chars.map(c => c.voice), ...readers.map(reader => reader.narrator)].includes(SAVED + v.ref));
  if(kind === "character") return {voices:used(characters.slice(0, 1), []), characters:characters.slice(0, 1)};
  const r = data.roleplay;
  if(!r || typeof r !== "object") fileError("This file holds no roleplay.");
  const cast = [...new Set(Array.isArray(r.characters) ? r.characters : [])].map(ref => characters.find(c => c.ref === ref)).filter(Boolean).slice(0, MAX_CHARS);
  if(!cast.length) fileError("This roleplay has no characters in the file.");
  const tuned = (value, t) => typeof value === "number" && value >= t.min && value <= t.max ? value : null;
  const roleplay = {title:fileText(r.title, MOST.title) || "With " + cast.map(c => c.name).join(", "), scenario:fileText(r.scenario, MOST.scenario),
    ...(typeof r.openingSpeech === "string" ? {openingNarration:fileText(r.openingNarration, MOST.openingNarration), openingSpeech:fileText(r.openingSpeech, MOST.openingSpeech)} : openingParts(fileText(r.opening, MOST.openingNarration + MOST.openingSpeech))),   // a file from before the first line had parts gives it as one
    openingBy:(cast.find(c => c.ref === r.openingBy) || cast[0]).ref, length:LENGTHS.some(([key]) => key === r.length) ? r.length : LENGTHS[0][0], context:CONTEXTS.some(([tokens]) => tokens === r.memory) ? r.memory : CONTEXTS[0][0],
    narrator:voiceIn(r.narrator, S.narrator), narratorMood:fileText(r.narratorMood, MOST.mood), model:typeof r.model === "string" ? r.model.trim() : "",
    temperature:tuned(r.temperature, TUNE.temperature), penalty:tuned(r.penalty, TUNE.penalty), think:r.think === true, planning:PLANNING.some(([key]) => key === r.planning) ? r.planning : "",
    tone:Array.isArray(r.tone) ? knownTones(r.tone) : [], toneWords:fileText(r.toneWords, MOST.toneWords)};
  const problem = openingProblem(roleplay.openingNarration, roleplay.openingSpeech);
  if(problem) throw new Error("This roleplay's first line cannot be used. " + problem);
  return {voices:used(cast, [roleplay]), characters:cast, roleplay};
}
/* Keeps what a checked file holds: its voices as saved voices and its characters, using a voice or a character already
   here instead when it is the same in every respect, so that uploading a file twice adds nothing the second time.
   Returns the id each ref became. */
async function keepFromFile({voices, characters}){
  const ids = new Map();                               // what each ref in the file became: "saved:" + a voice's ref, or a character's ref
  for(const v of voices){
    if(v.unsaved){ if(!await window.api.voiceSample(v.description)) await window.api.importVoice({key:v.description, sample:v.sample}); continue; }   // one already made here from the same description stays as it is
    let id = "";
    for(const mine of S.voices) if(!id && mine.name === v.name && mine.gender === v.gender && mine.description === v.description && await window.api.voiceSample(mine.id) === v.sample) id = mine.id;
    if(!id){
      id = SAVED + uid();
      await window.api.importVoice({key:id, sample:v.sample});
      S.voices.push({id, name:v.name, gender:v.gender, description:v.description});
    }
    ids.set(SAVED + v.ref, id);
  }
  const same = c => JSON.stringify(CHARACTER_FIELDS.map(key => c[key] ?? (key === "interests" ? [] : "")));
  for(const {ref, ...c} of characters){
    const made = {...c, voice:ids.get(c.voice) ?? c.voice}, known = S.characters.find(other => same(other) === same(made));
    if(known) ids.set(ref, known.id);
    else { const id = uid(); S.characters.push({id, ...made}); ids.set(ref, id); }
  }
  return ids;
}
/* A model's name as the engine has it, which may differ from the one given in case only. */
const installedName = model => engine.models.find(name => name.toLowerCase() === model.toLowerCase()) ?? model;
/* Asks for a file and keeps what it holds. kind: "character" or "roleplay". */
async function upload(kind){
  let raw;
  try { raw = await window.api.openFile(); } catch(e){ return toast("The file could not be read. " + e.message); }
  if(raw === null) return;
  let found;
  try { found = readFile(raw, kind); } catch(e){ return toast(e.message); }
  try {
    const ids = await keepFromFile(found);
    if(kind === "character"){ save(); render(false); return toast(`"${found.characters[0].name}" was uploaded.`); }
    await engineChecked;
    const r = found.roleplay, missing = r.model && !hasModel(r.model);
    const rp = {id:uid(), messages:[], began:Date.now(), updated:Date.now(), ...r, model:missing ? "" : installedName(r.model), charIds:found.characters.map(c => ids.get(c.ref)), openingBy:ids.get(r.openingBy), narrator:ids.get(r.narrator) ?? r.narrator};
    opening(rp);                                         // it opens with its first line, as one set up here does
    S.roleplays.push(rp);
    save(); render(false);
    toast(`"${r.title}" was uploaded.` + (missing ? ` Its model, ${r.model}, is not installed here, so it uses the default model instead.` : ""));
  } catch(e){ save(); render(false); toast("The file could not be uploaded completely. " + e.message); }
}

/* ---------- rendering ---------- */
const RETRY = '<button class="btn" data-act="retry">Try again</button>';
function setStatus(t){
  statusText = t;
  const el = $("#status"); if(el) el.innerHTML = esc(t) + (failed && !busy ? " " + RETRY : "");
}
function updateComposer(){
  const m = $("#mic"); if(m){ m.classList.toggle("rec", !!rec); m.setAttribute("aria-label", rec ? "Recording. Let go to send" : "Hold to speak"); m.setAttribute("aria-pressed", String(!!rec)); }
  const how = S.ui.text ? "hold the microphone to speak, or type" : "hold the microphone or the space bar to speak";
  const h = $("#turn"); if(h) h.textContent = rec ? "Recording… let go to send" : (busy ? "Cut in at any time: " : "Your turn: ") + how;
  const el = $("#status"); if(el && !statusText) el.innerHTML = failed ? "The reply did not arrive. " + RETRY : "";
}
const lineName = m => m.from === "user" ? "You" : getChar(m.from)?.name || "Former character";
const playAgain = m => m.from !== "user" ? `<button class="replay" data-act="replay" data-id="${m.id}">${ICON.vol}Play again<span class="sr">: ${esc(lineName(m))}</span></button>` : "";
const studio = () => S.ui.layout === "studio";
/* The character to show clearly: whoever is being heard, otherwise whoever spoke last. A line whose voice has not
   started yet does not count, so the portrait changes when the voice does. */
function clearSpeaker(rp){
  const heard = speaking?.said.length && rp.messages.find(m => m.id === speaking.id);
  if(heard) return heard.from;
  const lines = rp.messages.filter(m => m.from !== "user" && m.id !== speaking?.id);
  return lines[lines.length-1]?.from ?? rp.charIds[0];
}
/* One line: who says it, then each run of speech with narration between. The speaker's colour (--c) tints the name.
   A live line is the one being spoken: its newest sentence is strong and the earlier ones lighter. */
function lineBlocks(line, pieces, live){
  const c = getChar(line.from), mine = line.from === "user";
  const name = mine ? "You:" : lineName(line) + (line.to ? " to " + (line.to === "user" ? "you" : line.to) : "");
  const sentence = (piece, i) => `<span class="${live ? i === pieces.length - 1 ? "now" : "earlier" : ""}">${esc(unvoiced(piece.text))}</span>`;
  let html = "", run = [];
  const endRun = () => { if(run.length) html += `<p class="speech">${run.join(" ")}</p>`; run = []; };
  pieces.forEach((piece, i) => {
    if(!piece.narration) return run.push(sentence(piece, i));
    endRun();
    html += `<p class="narr"><span class="sr">Action: </span>${sentence(piece, i)}</p>`;
  });
  endRun();
  return `<article class="line ${mine ? "mine" : ""} ${live ? "live" : ""}" style="--c:${c ? colour(c)[0] : "var(--field)"}">${c ? avatar(c, 36) : ""}<div class="body"><div class="who">${esc(name)}${live ? ICON.wave : ""}</div>${html}${studio() && !mine && !live ? playAgain(line) + retryButton(line, curRp()) : ""}</div></article>`;
}
/* Draws who is clear and what is said. Cinema layout: one line at a time, under what the user said just before it.
   Studio layout: the whole conversation. A line being spoken fills in sentence by sentence, the newest at the bottom;
   nothing is taken away, and the text scrolls once it is full. */
function renderScene(){
  const rp = curRp(); if(!rp) return;
  const clear = clearSpeaker(rp);
  document.querySelectorAll("#stage figure").forEach(figure => figure.classList.toggle("clear", figure.dataset.c === clear));
  $("#stage .clear")?.scrollIntoView({inline:"center", block:"nearest"});   // matters when the window is too narrow to show everyone
  const box = $("#dialogue"); if(!box) return;
  const last = rp.messages.length - 1, at = Math.min(viewed ?? last, last), one = rp.messages[at];
  const before = rp.messages[at - 1];
  const shown = studio() ? rp.messages : !one ? [] : before?.from === "user" && one.from !== "user" ? [before, one] : [one];
  if(!shown.length){ box.innerHTML = studio() ? '<div class="words"><p class="muted">The scene is about to begin…</p></div>' : ""; return; }
  const live = line => speaking?.id === line.id, key = studio() ? "all" : one.id;
  const kept = $(".words", box)?.scrollTop;
  if(box.dataset.line !== key) follow(WORDS);
  const pager = last > 0 ? `<button class="icon" data-act="turnLine" data-d="-1" aria-label="Earlier line" ${at ? "" : "disabled"}>${ICON.left}</button><span class="small muted">line ${at + 1} of ${last + 1}</span><button class="icon" data-act="turnLine" data-d="1" aria-label="Later line" ${at < last ? "" : "disabled"}>${ICON.right}</button>` : "";
  const tools = studio() ? "" : `<header>${live(one) ? "" : playAgain(one) + retryButton(one, rp)}${pager}</header>`;
  box.dataset.line = key;
  box.innerHTML = `${tools}<div class="words" tabindex="0" role="log" aria-label="${studio() ? "Conversation" : "What is being said"}" aria-live="${S.ui.voice ? "off" : "polite"}">${shown.map(line => lineBlocks(line, live(line) ? speaking.said : linePieces(line.text), live(line))).join("")}</div>`;
  const words = $(".words", box);
  if(!lists[WORDS].pinned) words.scrollTop = kept;
  settle(WORDS);
  sizes.observe(words);
}
/* The conversation and the script behave like a chat window: each stays on its newest words, whatever changes size, until the
   user scrolls up to read. It follows again once the user scrolls back down or sends a message. */
const WORDS = "#dialogue .words", SCRIPT = "#lines";
const lists = {[WORDS]:{pinned:true, measured:""}, [SCRIPT]:{pinned:true, measured:""}};   // measured: the list's size when its place was last settled
const sizeOf = list => list.clientHeight + " " + list.scrollHeight;
function settle(which){
  const list = $(which); if(!list) return;
  if(lists[which].pinned) list.scrollTop = list.scrollHeight;
  lists[which].measured = sizeOf(list);
}
function follow(which){ for(const key of which ? [which] : Object.keys(lists)){ lists[key].pinned = true; settle(key); } }
const sizes = new ResizeObserver(() => Object.keys(lists).forEach(settle));
document.addEventListener("scroll", e => {
  const which = e.target instanceof Element && Object.keys(lists).find(key => e.target.matches(key));
  if(!which || sizeOf(e.target) !== lists[which].measured) return;   // a scroll caused by a change of size is not the user's doing
  lists[which].pinned = e.target.scrollHeight - e.target.scrollTop - e.target.clientHeight < 40;
}, true);

/* What the check of this computer found, in words. The sizes are of memory, in gigabytes: a model or voice wants a
   graphics card with at least that much, so that all of it fits there beside what else is loaded. A computer whose card
   is too small for any model runs the medium models in that much ordinary memory, slowly, and otherwise the small ones. */
const SUITS = {large:16, medium:8, small:4, mediumMemory:15, gpu:6, mood:4};
const gigabytes = bytes => bytes / 2 ** 30;
const cardMemory = found => found.cards.length ? Math.round(gigabytes(found.cards[0].memory)) : 0;   // in whole gigabytes, as cards are sold: one may report a little less than its size
const suitedSize = found => cardMemory(found) >= SUITS.large ? "large" : cardMemory(found) >= SUITS.medium ? "medium" : cardMemory(found) >= SUITS.small ? "small" : gigabytes(found.memory) >= SUITS.mediumMemory ? "medium" : "small";
/* Where a model ran, in words, from whether the AI engine found a graphics card and the share of the model that was on it. */
const placed = (found, share) => !found.engineUsesCard ? "on the processor: the AI engine found no graphics card it can use" : share > 0.99 ? "entirely on the graphics card" : share < 0.01 ? "on the processor only, not on the graphics card" : `${Math.round(share * 100)}% on the graphics card and the rest on the processor, which slows it`;
const NEARLY = 1.5;              // a voice that takes up to this many times as long to make as to say still starts soon, now that its sound plays as it is made
const WORDS_PER_TOKEN = 0.75;   // ordinary English: a little under a word to each token the model writes
/* What to do about a model that is only partly on the graphics card. */
const fits = (found, tried) => found.engineUsesCard && tried.onCard <= 0.99 ? " It is too large for this graphics card: a smaller model that fits on it entirely will write several times faster." : "";

  const size = SIZES.find(([key]) => key === suitedSize(found))[1].toLowerCase(), tried = found.model;
  return `The ${size} models suit this computer best.` + (tried.state === "timed" ? ` ${tried.name} writes about ${Math.round(tried.tokensPerSecond * WORDS_PER_TOKEN)} words a second here, ${placed(found, tried.onCard)}.${fits(found, tried)}`
    : tried.state === "failed" ? " The default model could not be tried. " + tried.why : "");
}
/* The mark on a size of model, once the computer has been checked: the size that suits it, and the sizes too large to fit
   on its graphics card, which have to be moved on and off it between a line and its voice. */
function sizeMark(size){
  const found = S.computer, order = SIZES.map(([key]) => key);
  if(!found) return "";
  if(suitedSize(found) === size) return ' <span class="pick">Suits this computer</span>';
  return found.engineUsesCard && order.indexOf(size) > order.indexOf(suitedSize(found)) ? ' <span class="pick warn">Too large for this graphics card</span>' : "";

    return (tried.took <= tried.speech ? `Fast enough here: ${timing}.` : tried.took <= tried.speech * NEARLY ? `Nearly as fast as speech here: ${timing}, so longer lines start after a short wait.` : `Slow here: ${timing}, so there is a wait before each line.`) + onCard;

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if(!el || !A[el.dataset.act]) return;
  A[el.dataset.act](el);
  // When the action redrew the page and the button is gone, the focus goes to the button that took its place, or to the page's heading.
  if(document.contains(el) || document.activeElement !== document.body) return;
  const same = Object.entries(el.dataset).map(([key, value]) => `[data-${key.replace(/[A-Z]/g, letter => "-" + letter.toLowerCase())}="${CSS.escape(value)}"]`).join("");
  (document.querySelector(same) || $("#app h1"))?.focus({preventScroll:true});
});

  if(((e.ctrlKey && e.altKey) || e.getModifierState("AltGraph")) && e.shiftKey && (e.code === "KeyA" || (e.key || "").toLowerCase() === "a")){ e.preventDefault(); if(adminOpen || $("#adminDlg").open) return; $("#adminErr").textContent = ""; $("#adminPw").value = ""; $("#adminDlg").showModal(); return; }
  if(e.key === "Enter" && !e.shiftKey && e.target.id === "reply" && !e.isComposing){ e.preventDefault(); SUB.send(); }
  if(e.key === "Escape" && document.fullscreenElement) document.exitFullscreen();
  if(talkKey(e) || ((e.code === "Space" || e.code === "Enter") && e.target.id === "mic")){ e.preventDefault(); if(!e.repeat) holdMic(); }
}, true);
window.api.onProgress(showProgress);
(async () => {
  try { CFG = await window.api.getSettings(); } catch(e){ document.body.textContent = "The program's settings could not be read. " + e.message; return; }
  if(S.size){ S.model ||= CFG.models[S.size]?.[0].name || ""; delete S.size; save(); }   // saved before each roleplay had its own model: a size was chosen, not a model
  const unsplit = S.roleplays.filter(r => typeof r.opening === "string");   // saved before the first line was written in two parts
  if(unsplit.length){ for(const r of unsplit){ Object.assign(r, openingParts(r.opening)); delete r.opening; } save(); }
  country = await window.api.country().catch(() => "");   // the country the help screen gives the helpline of
  render();
  engineChecked = refreshEngine();
  if(curRp()) resume(); else { requireModel(); warmUp({model:"", context:CONTEXTS[0][0], charIds:[], narrator:""}); }   // with no scene open, the default model is loaded for the next one
  try { voiceList = await window.api.voices(); } catch(e){ return toast("The voices could not be loaded. " + e.message); }
  // The samples of voices that are neither saved nor described anywhere are removed: by the voice chosen, whether or not it can speak at the moment.
  window.api.keepVoices([...S.voices.map(v => v.id), ...describing(S.characters, [S, ...S.roleplays], c => c.voice).map(voice => voice.key)]).catch(() => {});
  if(view === "setup" || view === "cast") render(false);   // a page with a list of voices was drawn before there were any
  if(curRp() && view === "chat") warmUp(curRp());      // again, now that it is known which voices the scene uses
})();
</script>
